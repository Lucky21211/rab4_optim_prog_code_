name: cassiopeia_pr4
networks:
  backend:
volumes:
  pgdata:
  appdata:
  csvdata:
  redisdata:

x-app-env: &app-env
  APP_ENV: production
  APP_DEBUG: "false"
  APP_KEY: ${APP_KEY:?Set APP_KEY in .env}
  APP_URL: http://localhost:${WEB_PORT:-8080}
  LOG_CHANNEL: stderr
  DB_CONNECTION: pgsql
  DB_HOST: db
  DB_PORT: 5432
  DB_DATABASE: ${POSTGRES_DB:-monolith}
  DB_USERNAME: ${POSTGRES_USER:-monouser}
  DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  CACHE_STORE: redis
  REDIS_CLIENT: predis
  REDIS_HOST: redis
  SESSION_DRIVER: file
  QUEUE_CONNECTION: sync
  RUST_BASE: http://rust_iss:3000
  READ_CACHE_TTL: ${READ_CACHE_TTL:-10}
  GALLERY_CACHE_TTL: ${GALLERY_CACHE_TTL:-120}
  CMS_CACHE_TTL: ${CMS_CACHE_TTL:-60}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-monolith}
      POSTGRES_USER: ${POSTGRES_USER:-monouser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TZ: UTC
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks: [backend]
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]
  rust_iss:
    build: ./services/rust-iss
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-monouser}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-monolith}
      NASA_API_KEY: ${NASA_API_KEY:-}
      JWST_API_KEY: ${JWST_API_KEY:-}
      JWST_EMAIL: ${JWST_EMAIL:-}
      ASTRO_APP_ID: ${ASTRO_APP_ID:-}
      ASTRO_APP_SECRET: ${ASTRO_APP_SECRET:-}
      NASA_API_URL: ${NASA_API_URL:-https://visualization.osdr.nasa.gov/biodata/api/v2/datasets/?format=json}
      WHERE_ISS_URL: ${WHERE_ISS_URL:-https://api.wheretheiss.at/v1/satellites/25544}
      APOD_URL: ${APOD_URL:-https://api.nasa.gov/planetary/apod}
      NEO_URL: ${NEO_URL:-https://api.nasa.gov/neo/rest/v1/feed}
      FLR_URL: ${FLR_URL:-https://api.nasa.gov/DONKI/FLR}
      CME_URL: ${CME_URL:-https://api.nasa.gov/DONKI/CME}
      SPACEX_URL: ${SPACEX_URL:-https://api.spacexdata.com/v4/launches/next}
      JWST_HOST: ${JWST_HOST:-https://api.jwstapi.com}
      ASTRO_URL: ${ASTRO_URL:-https://api.astronomyapi.com/api/v2/bodies/events}
      FETCH_EVERY_SECONDS: ${FETCH_EVERY_SECONDS:-600}
      ISS_EVERY_SECONDS: ${ISS_EVERY_SECONDS:-120}
      APOD_EVERY_SECONDS: ${APOD_EVERY_SECONDS:-43200}
      NEO_EVERY_SECONDS: ${NEO_EVERY_SECONDS:-7200}
      DONKI_EVERY_SECONDS: ${DONKI_EVERY_SECONDS:-3600}
      SPACEX_EVERY_SECONDS: ${SPACEX_EVERY_SECONDS:-3600}
      HTTP_TIMEOUT_SECONDS: ${HTTP_TIMEOUT_SECONDS:-10}
      HTTP_RETRIES: ${HTTP_RETRIES:-2}
      RATE_LIMIT_MS: ${RATE_LIMIT_MS:-1000}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports: ["127.0.0.1:${RUST_PORT:-8081}:3000"]
    networks: [backend]
  php:
    build: ./services/php-web
    environment: *app-env
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      rust_iss: {condition: service_healthy}
    volumes: [appdata:/var/www/html]
    healthcheck:
      test: ["CMD", "php", "-r", '$$s=@fsockopen("127.0.0.1",9000); exit($$s?0:1);']
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [backend]
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      php: {condition: service_healthy}
    volumes:
      - appdata:/var/www/html:ro
      - ./services/php-web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["127.0.0.1:${WEB_PORT:-8080}:80"]
    networks: [backend]
  pascal_legacy:
    build: ./services/pascal-legacy
    environment:
      CSV_OUT_DIR: /data/csv
      LEGACY_CRON: ${LEGACY_CRON:-*/5 * * * *}
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-monouser}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-monolith}
    depends_on:
      php: {condition: service_healthy}
    volumes: [csvdata:/data/csv]
    networks: [backend]
